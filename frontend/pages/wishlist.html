<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Wishlist | OmniTrade Global</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Cabinet+Grotesk:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

  <div class="top-strip">
    <div class="container top-strip-inner">
      <div class="strip-left">
        <a href="../index.html" style="color:var(--text-secondary);">← Marketplace Home</a>
      </div>
      <div class="strip-right">
        <span>Persistent Wishlist Storage</span>
      </div>
    </div>
  </div>

  <header class="header-main">
    <div class="container header-container">
      <a href="../index.html" class="brand-wordmark">
        OmniTrade<span class="brand-dot">.</span>
      </a>

      <nav class="nav-links">
        <a href="./products.html" class="nav-link">Catalog</a>
        <a href="./seller.html" class="nav-link">Seller Hub</a>
        <a href="./orders.html" class="nav-link">Orders</a>
        <a href="./wishlist.html" class="nav-link active">Wishlist</a>
      </nav>

      <div class="header-actions">
        <a href="./cart.html" class="btn-icon-count" title="Shopping Bag">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top:40px; padding-bottom:60px;">
    <h1 style="font-family:var(--font-display); font-size:26px; font-weight:800; margin-bottom:24px;">Saved Masterpieces</h1>

    <div id="wishlist-items-grid" class="product-grid">
      <!-- Populated via script -->
    </div>
  </main>

  <footer class="footer-main">
    <div class="container footer-bottom">
      <div>© 2026 OmniTrade Global Marketplace Inc.</div>
      <a href="../index.html">Back to Home</a>
    </div>
  </footer>

  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const store = window.store;
      const grid = document.getElementById('wishlist-items-grid');
      const savedProds = store.state.products.filter(p => store.isInWishlist(p.id));

      if (savedProds.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 48px 0; color: var(--text-muted);">
            <p style="font-size: 15px; font-weight: 600; color: var(--text-secondary);">Your wishlist is empty</p>
            <a href="./products.html" class="btn-primary" style="margin-top:12px;">Explore Catalog</a>
          </div>
        `;
        return;
      }

      grid.innerHTML = savedProds.map(p => `
        <article class="product-card">
          <div class="product-media-wrapper">
            <img src=".${p.image}" class="product-img" onerror="this.src='../assets/images/hero.jpg'" />
          </div>
          <div class="product-body">
            <div class="product-meta-row"><span>${p.brand}</span> · <span>${p.origin}</span></div>
            <h3 class="product-title">${p.title}</h3>
            <div class="product-price-row">
              <span class="price-current tabular-nums">${store.formatPrice(p.price)}</span>
            </div>
            <button class="btn-primary" style="margin-top:12px; justify-content:center;" onclick="window.store.addToCart(window.store.state.products.find(x => x.id === '${p.id}')); window.location.href='./cart.html';">
              Move to Bag
            </button>
          </div>
        </article>
      `).join('');
    });
  </script>
</body>
</html>
