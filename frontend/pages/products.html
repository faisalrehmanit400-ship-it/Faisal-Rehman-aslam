<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curated Global Catalog | OmniTrade Marketplace</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Cabinet+Grotesk:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Top Strip -->
  <div class="top-strip">
    <div class="container top-strip-inner">
      <div class="strip-left">
        <a href="../index.html" style="color:var(--text-secondary);">← Return to Marketplace Home</a>
      </div>
      <div class="strip-right">
        <span>Duty & Taxes Calculated at Checkout</span>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="header-main">
    <div class="container header-container">
      <a href="../index.html" class="brand-wordmark">
        OmniTrade<span class="brand-dot">.</span>
      </a>

      <nav class="nav-links">
        <a href="./products.html" class="nav-link active">Catalog</a>
        <a href="./seller.html" class="nav-link">Seller Hub</a>
        <a href="./orders.html" class="nav-link">Orders</a>
        <a href="./help.html" class="nav-link">Help</a>
      </nav>

      <div class="header-actions">
        <a href="./account.html" class="btn-icon-count" title="Account">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </a>
        <a href="./cart.html" class="btn-icon-count" title="Shopping Bag">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="badge-count cart-count" style="display:none;">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top:40px; padding-bottom:60px;">
    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:28px;">
      <div>
        <h1 style="font-family:var(--font-display); font-size:28px; font-weight:800; letter-spacing:-0.03em;">
          International Curations
        </h1>
        <p style="font-size:13px; color:var(--text-muted); margin-top:4px;">Direct shipments from certified international creators</p>
      </div>

      <div style="display:flex; gap:12px;">
        <select id="sort-selector" class="select-filter">
          <option value="featured">Featured First</option>
          <option value="price_asc">Price: Low to High</option>
          <option value="price_desc">Price: High to Low</option>
          <option value="rating">Top Rated</option>
        </select>
      </div>
    </div>

    <!-- Product Grid -->
    <div class="product-grid" id="product-grid">
      <!-- Populated via app.js -->
    </div>
  </main>

  <footer class="footer-main">
    <div class="container footer-bottom">
      <div>© 2026 OmniTrade Global Marketplace Inc.</div>
      <a href="../index.html">Back to Home</a>
    </div>
  </footer>

  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
